name: CI (CPU)

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  build-cpu:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "CPU (clang 16, Debug)",         build: "Debug",   tag: llvm16-cuda12.9, cxxstd: "20", cxxflags: "-stdlib=libc++" }
          - { name: "CPU (clang 16, Debug, c++23)",  build: "Debug",   tag: llvm16-cuda12.9, cxxstd: "23", cxxflags: "-stdlib=libc++" }
          - { name: "CPU (clang 16, Debug, TSAN)",   build: "Debug",   tag: llvm16-cuda12.9, cxxstd: "20", cxxflags: "-fsanitize=thread" }
          - { name: "CPU (clang 16, Release)",       build: "Release", tag: llvm16-cuda12.9, cxxstd: "20", cxxflags: "-stdlib=libc++" }
          - { name: "CPU (clang 16, Release, ASAN)", build: "Release", tag: llvm16-cuda12.9, cxxstd: "20", cxxflags: "-stdlib=libc++ -fsanitize=address -fsanitize-ignorelist=/home/coder/stdexec/sanitizer-ignorelist.txt" }
          - { name: "CPU (clang 22, Debug)",         build: "Debug",   tag: llvm22-cuda13.2, cxxstd: "23", cxxflags: "-stdlib=libc++" }
          # Clang 23 is the only supported toolchain for modular builds (see
          # "Modular builds" in the README). rapidsai/devcontainers does not
          # publish an llvm23 image yet, so this job installs Clang 23 from
          # apt.llvm.org on top of the llvm22 image. To de-hack once the image
          # exists: drop `llvm: "23"` and set tag: llvm23-cuda13.2 -- the
          # install step below then no-ops.
          - { name: "CPU (clang 23, Debug, modules)",         build: "Debug",   tag: llvm22-cuda13.2, llvm: "23", cxxstd: "23", cxxflags: "-stdlib=libc++" }
          - { name: "CPU (clang 22, Release)",       build: "Release", tag: llvm22-cuda13.2, cxxstd: "23", cxxflags: "-stdlib=libc++" }
          - { name: "CPU (clang 22, Release, noexcept)",       build: "Release", tag: llvm22-cuda13.2, cxxstd: "23", cxxflags: "-stdlib=libc++ -fno-exceptions" }
          - { name: "CPU (gcc 12, Debug)",           build: "Debug",   tag: gcc12-cuda12.9,  cxxstd: "20", cxxflags: "", }
          - { name: "CPU (gcc 12, Release)",         build: "Release", tag: gcc12-cuda12.9,  cxxstd: "20", cxxflags: "", }
          # With the following config, 2 tests mysteriously time out, but only in CI and not locally.
          # - { name: "CPU (gcc 12, Release, ASAN)",   build: "Release", tag: gcc12-cuda12.9,  cxxstd: "20", cxxflags: "-fsanitize=address" }
          - { name: "CPU (gcc 12, Release, TSAN)",   build: "Release", tag: gcc12-cuda12.9,  cxxstd: "20", cxxflags: "-fsanitize=thread" }
          - { name: "CPU (gcc 13, Debug)",           build: "Debug",   tag: gcc13-cuda12.9,  cxxstd: "20", cxxflags: "", }
          - { name: "CPU (gcc 14, Debug)",           build: "Debug",   tag: gcc14-cuda12.9,  cxxstd: "20", cxxflags: "", }
          - { name: "CPU (gcc 14, Debug, ASAN)",     build: "Debug",   tag: gcc14-cuda12.9,  cxxstd: "20", cxxflags: "-fsanitize=address" }
          - { name: "CPU (gcc 14, Debug, TSAN)",     build: "Debug",   tag: gcc14-cuda12.9,  cxxstd: "20", cxxflags: "-fsanitize=thread" }
          - { name: "CPU (gcc 14, Release, ASAN)",   build: "Release", tag: gcc14-cuda12.9,  cxxstd: "20", cxxflags: "-fsanitize=address" }
          - { name: "CPU (gcc 14, Release, LEAK)",   build: "Release", tag: gcc14-cuda12.9,  cxxstd: "20", cxxflags: "-fsanitize=leak", }
          - { name: "CPU (gcc 14, Release, c++23)",  build: "Release", tag: gcc14-cuda12.9,  cxxstd: "23", cxxflags: "", }
          - { name: "CPU (gcc 15, Release, c++23)",  build: "Release", tag: gcc15-cuda12.9,  cxxstd: "23", cxxflags: "", }
          - { name: "CPU (gcc 15, Release, c++23,noexcept)",  build: "Release", tag: gcc15-cuda12.9,  cxxstd: "23", cxxflags: "-fno-exceptions", }
    container:
      options: -u root
      image: rapidsai/devcontainers:26.08-cpp-${{ matrix.tag }}
    permissions:
      id-token: write # This is required for configure-aws-credentials
      contents: read  # This is required for actions/checkout
    defaults:
      run:
        shell: su coder {0}
        working-directory: /home/coder
    steps:
      - name: Checkout stdexec
        uses: actions/checkout@v4
        with:
          path: stdexec
          persist-credentials: false
      - name: Setup environment
        run: |
          echo "ARTIFACT_PREFIX=${{runner.os}}-${{matrix.tag}}${{ matrix.llvm && format('-llvm{0}', matrix.llvm) || '' }}-amd64" >> "${GITHUB_ENV}"
          echo "ARTIFACT_SUFFIX=${{github.run_id}}-${{github.run_attempt}}-$RANDOM" >> "${GITHUB_ENV}"
      - if: ${{ matrix.llvm != '' && !startsWith(matrix.tag, format('llvm{0}-', matrix.llvm)) }}
        name: Install Clang ${{ matrix.llvm }} from apt.llvm.org
        # Runs as root: the workflow default shell (`su coder`) is overridden.
        shell: bash
        run: |
          set -ex
          . /etc/os-release
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            -o /etc/apt/trusted.gpg.d/apt-llvm.asc
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-${{ matrix.llvm }} main" \
            > /etc/apt/sources.list.d/llvm-${{ matrix.llvm }}.list
          apt-get update
          # NB: libc++-N-dev Conflicts with the image's libc++-22-dev and will
          # replace it. That is fine here -- this job builds only with Clang
          # ${{ matrix.llvm }} -- but it is why this cannot be a shared setup step.
          apt-get install -y --no-install-recommends \
            clang-${{ matrix.llvm }} \
            libc++-${{ matrix.llvm }}-dev \
            libc++abi-${{ matrix.llvm }}-dev
          /usr/lib/llvm-${{ matrix.llvm }}/bin/clang++ --version

      - if: github.repository_owner == 'NVIDIA'
        name: Get AWS credentials for sccache bucket
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-duration-seconds: 28800 # 8 hours
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-NVIDIA
      - name: Build and test CPU schedulers
        env:
          ASAN_OPTIONS: alloc_dealloc_mismatch=0
          NVCC_APPEND_FLAGS: "-t=100"
          SCCACHE_BUCKET: "rapids-sccache-devs"
          SCCACHE_DIST_REQUEST_TIMEOUT: "7140"
          SCCACHE_DIST_URL: "https://amd64.linux.sccache.rapids.nvidia.com"
          SCCACHE_IDLE_TIMEOUT: "0"
          SCCACHE_NO_DIST_COMPILE: ${{ contains(matrix.name, 'modules') && '1' || '' }}
          SCCACHE_REGION: "us-east-2"
          SCCACHE_S3_KEY_PREFIX: "nvidia-stdexec-dev"
          SCCACHE_S3_PREPROCESSOR_CACHE_KEY_PREFIX: "nvidia-stdexec-dev/preprocessor"
          SCCACHE_S3_USE_PREPROCESSOR_CACHE_MODE: "true"
          SCCACHE_SERVER_LOG: "sccache=debug"
          SCCACHE_SERVER_PORT: "4225"
        run: |
          set -e;
          source /etc/profile
          set -x;

          devcontainer-utils-install-sccache --version rapids;

          devcontainer-utils-init-sccache-dist                                          \
              --enable-sccache-dist - <<< "                                             \
              --auth-type 'token'                                                       \
              --auth-token '$(                                                          \
                curl -fsSL -H "Authorization: Bearer $(                                 \
                  curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=token.rapids.nvidia.com"  \
                | jq -r '.value'                                                        \
                )" https://token.rapids.nvidia.com/gh/token/exchange                    \
              | jq -r '.token')'                                                        \
          ";

          # Copy source folder into ~/stdexec
          cp -r "${GITHUB_WORKSPACE}"/stdexec ~/;
          chown -R coder:coder ~/stdexec;
          cd ~/stdexec;

          # Configure
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DSTDEXEC_ENABLE_TBB:BOOL=${{ !contains(matrix.cxxflags, '-fsanitize') && !contains(matrix.name, 'modules') }} \
            -DSTDEXEC_ENABLE_ASIO:BOOL=TRUE \
            -DSTDEXEC_ASIO_IMPLEMENTATION:STRING=boost \
            -DCMAKE_CXX_STANDARD:STRING=${{ matrix.cxxstd }} \
            -DCMAKE_CXX_EXTENSIONS:BOOL=OFF \
            -DSTDEXEC_BUILD_TESTS:BOOL=ON \
            -DSTDEXEC_BUILD_EXAMPLES:BOOL=${{ !contains(matrix.name, 'modules') }} \
            -DSTDEXEC_BUILD_MODULES:BOOL=${{ contains(matrix.name, 'modules') }} \
            ${{ matrix.llvm && format('-DCMAKE_CXX_COMPILER=/usr/lib/llvm-{0}/bin/clang++', matrix.llvm) || '' }} \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/usr/lib/llvm-${{ matrix.llvm || '22' }}/lib/libc++.modules.json \
            ;

          # Compile
          # Run a serial build if we're building the modular build because it tends
          # to result in fewer Clang ICEs.
          cmake --build build -v -j ${{ contains(matrix.name, 'modules') && 1 || 512 }};

          # Print sccache stats
          sccache -s;

          # Tests
          SCCACHE_NO_CACHE=1 SCCACHE_NO_DIST_COMPILE=1 \
          ctest --test-dir build --verbose --output-on-failure --timeout 60;
      - if: ${{ !cancelled() }}
        name: Upload sccache logs
        uses: actions/upload-artifact@v4
        with:
          name: sccache-client-logs-${{env.ARTIFACT_PREFIX}}-${{env.ARTIFACT_SUFFIX}}
          path: /tmp/sccache*.log
          compression-level: 9

  valgrind-run-loop:
    runs-on: ubuntu-latest
    name: CPU (gcc 14, Valgrind run_loop)
    container:
      options: -u root
      image: rapidsai/devcontainers:26.08-cpp-gcc14-cuda12.9
    steps:
      - name: Checkout stdexec
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Valgrind
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends valgrind

      - name: Build run_loop reproducer
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DSTDEXEC_BUILD_TESTS=ON
          cmake --build build --target test.run_loop_finish_repro -v

      - name: Run run_loop reproducer under Valgrind
        run: |
          timeout 60s valgrind \
            --fair-sched=no \
            --error-exitcode=1 \
            --quiet \
            ./build/test/test.run_loop_finish_repro

  ci-cpu:
    runs-on: ubuntu-latest
    name: CI (CPU)
    needs:
      - build-cpu
      - valgrind-run-loop
    steps:
      - run: echo "CI (CPU) success"

  build-cpu-windows:
    runs-on: windows-2022
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: "cl",       build: "Debug",   name: "CPU (Windows) (msvc 14.43, Debug)",   tag: cuda12.9-cl14.43 }
          - { compiler: "cl",       build: "Release", name: "CPU (Windows) (msvc 14.43, Release)", tag: cuda12.9-cl14.43 }
          - { compiler: "cl",       build: "Debug",   name: "CPU (Windows) (msvc 14.50, Debug)",   tag: cuda13.2-cl14.50 }
          - { compiler: "cl",       build: "Release", name: "CPU (Windows) (msvc 14.50, Release)", tag: cuda13.2-cl14.50 }
          #- { compiler: "clang++",  build: "Debug",   name: "CPU (Windows) (clang, Debug)" }
          #- { compiler: "clang++",  build: "Release", name: "CPU (Windows) (clang, Release)" }
          #- { compiler: "clang-cl", build: "Debug",   name: "CPU (Windows) (clang-cl, Debug)" }
          #- { compiler: "clang-cl", build: "Release", name: "CPU (Windows) (clang-cl, Release)" }

    steps:
      - name: Checkout stdexec (Windows)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test CPU schedulers (Windows)
        shell: pwsh
        run: |
          docker pull rapidsai/devcontainers:26.08-${{ matrix.tag }}-windows2022
          docker run --isolation=process -v "$(pwd):C:/stdexec" rapidsai/devcontainers:26.08-${{ matrix.tag }}-windows2022 powershell C:/stdexec/.github/workflows/test-windows.ps1 -Compiler '${{ matrix.compiler }}' -Config '${{ matrix.build }}'

  ci-cpu-windows:
    runs-on: windows-latest
    name: CI (CPU) (Windows)
    needs:
      - build-cpu-windows
    steps:
      - run: echo "CI (CPU) (Windows) success"

  build-cpu-macos:
    runs-on: macos-26-large
    name: macos-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: "clang++",  build: "Debug",   name: "CPU (MacOS) (clang, Debug)" }
          - { compiler: "clang++",  build: "Release", name: "CPU (MacOS) (clang, Release)" }
    steps:
      - name: Checkout stdexec (MacOS)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew update
          brew install ninja
        shell: bash

      - name: Build and test CPU schedulers (MacOS)
        shell: bash
        run: |
          mkdir build
          cmake -S. -Bbuild -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DSTDEXEC_ENABLE_ASIO:BOOL=TRUE \
            -DSTDEXEC_ASIO_IMPLEMENTATION:STRING=boost \
            -DCMAKE_CXX_STANDARD:STRING=20 \
            -DSTDEXEC_BUILD_TESTS:BOOL=ON

          cmake --build build/ -v
          cd build
          ctest --output-on-failure

  ci-cpu-macos:
    runs-on: macos-latest-large
    name: CI (CPU) (MacOS)
    needs:
      - build-cpu-macos
    steps:
      - run: echo "CI (CPU) (MacOS) success"
